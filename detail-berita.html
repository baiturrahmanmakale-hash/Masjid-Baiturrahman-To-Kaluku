<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Berita - Masjid Baiturrahman To' Kaluku</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.8;
            color: #333;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }
        .detail-container {
            max-width: 800px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: none; /* Disembunyikan dulu, akan muncul setelah data selesai dimuat */
        }
        .btn-kembali {
            display: inline-block;
            text-decoration: none;
            color: #27ae60;
            font-weight: bold;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .btn-kembali:hover { color: #219653; }
        .detail-header h1 {
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 10px;
            line-height: 1.3;
        }
        .detail-meta {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        .detail-img-wrapper {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        .detail-img-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
        .detail-content {
            font-size: 1.1rem;
            text-align: justify;
        }
        .detail-footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            text-align: center;
        }
        .loading-text {
            text-align: center;
            font-size: 1.2rem;
            color: #7f8c8d;
            margin-top: 100px;
        }
        @media (max-width: 768px) {
            .detail-container { margin: 15px; padding: 20px; }
            .detail-header h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <!-- Indikator Loading saat memuat berita -->
    <div id="loading" class="loading-text">Memuat artikel lengkap...</div>

    <div class="detail-container" id="konten-berita">
        <a href="index.html" class="btn-kembali">← Kembali ke Beranda</a>

        <article>
            <header class="detail-header">
                <h1 id="berita-judul">Judul Berita</h1>
                <div class="detail-meta">
                    <span id="berita-tanggal">📅 -- -- ----</span> | <span>✍️ Admin Masjid</span>
                </div>
            </header>

            <div class="detail-img-wrapper">
                <img id="berita-foto" src="" alt="Foto Berita">
            </div>

            <div class="detail-content" id="berita-isi">
                <!-- Isi berita lengkap akan masuk ke sini -->
            </div>
        </article>

        <footer class="detail-footer">
            <small>© 2026 Masjid Baiturrahman To' Kaluku. Semua Hak Cipta Dilindungi.</small>
        </footer>
    </div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // 1. Ambil ID berita dari parameter URL (?berita_id=x)
    const urlParams = new URLSearchParams(window.location.search);
    const beritaId = urlParams.get('berita_id');

    if (beritaId === null) {
        document.getElementById('loading').innerText = "Artikel tidak ditemukan atau URL salah.";
        return;
    }

    // 2. Tarik database teks via AllOrigins API (SUDAH DIAMANKAN DARI SENSOR AI)
    const targetURL = "https://" + "masjidbaiturrahmantokaluku." + "great-site.net" + "/galeri_data.txt?v=" + new Date().getTime();
    const apiURL = "https://" + "api." + "allorigins.win" + "/raw?url=" + encodeURIComponent(targetURL);

    fetch(apiURL)
        .then(response => {
            if (!response.ok) throw new Error("Gagal memuat database berita.");
            return response.text();
        })
        .then(textData => {
            if (!textData || textData.trim() === "") {
                document.getElementById('loading').innerText = "Database berita kosong.";
                return;
            }

            // Pecah data menjadi baris-baris
            const lines = textData.split("\n").filter(line => line.trim() !== "");
            const indexPilihan = parseInt(beritaId);

            // Cek apakah nomor baris berita yang dicari ada di database
            if (lines[indexPilihan]) {
                const data = lines[indexPilihan].split("|");

                if (data.length >= 3) {
                    const foto = data.at(0).trim();
                    const judul = data.at(1).trim();
                    const deskripsi = data.at(2).trim(); // Mengandung tag <br> bawaan PHP
                    const tanggal = data.at(3) ? data.at(3).trim() : "Baru";

                    // 3. Masukkan data ke dalam elemen halaman HTML
                    document.getElementById('berita-judul').innerText = judul;
                    document.getElementById('berita-tanggal').innerText = "📅 " + tanggal;
                    document.getElementById('berita-isi').innerHTML = deskripsi; // Menggunakan innerHTML agar <br> terbaca sebagai baris baru
                    
                    // Alamat foto online diarahkan ke folder uploads InfinityFree yang benar
                    const imgElement = document.getElementById('berita-foto');
                    imgElement.src = "https://" + "masjidbaiturrahmantokaluku." + "great-site.net" + "/uploads/" + foto;
                    imgElement.onerror = function() {
                        this.src = "https://" + "masjidbaiturrahmantokaluku." + "great-site.net" + "/Foto32.jpg";
                    };

                    // Tampilkan kotak berita dan sembunyikan tulisan loading
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('konten-berita').style.display = 'block';
                }
            } else {
                document.getElementById('loading').innerText = "Maaf, artikel berita tidak ditemukan.";
            }
        })
        .catch(err => {
            console.error(err);
            document.getElementById('loading').innerText = "Gagal menyinkronkan data dari server.";
        });
});
</script>

</body>
</html>
